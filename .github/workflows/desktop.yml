name: Desktop app

# Builds installers on each platform's own runner. The Windows installer must be
# built on Windows: cross-building NSIS on Apple Silicon corrupts the uninstaller
# (electron-builder issue #10258).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run app:test
      - run: npm run app:build
      - name: Build installers
        run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: reader343-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Draft a GitHub release with the installers
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/*
