appId: com.smartdarkreader.app
productName: Reader343
artifactName: Reader343-${version}-${os}-${arch}.${ext}
copyright: Copyright © 2026 Mustafa Manhal
directories:
  output: release
  buildResources: build
files:
  - desktop/**
  - app-dist/**
  - package.json
  - "!**/*.map"
  # The speech model for natural voices (102 MB) is fetched from the web app when it is wanted.
  - "!app-dist/voices/**"
  - "!node_modules/**"
fileAssociations:
  - ext: pdf
    name: PDF Document
    description: PDF Document
    mimeType: application/pdf
    role: Viewer
  - ext: epub
    name: EPUB Book
    description: EPUB Book
    mimeType: application/epub+zip
    role: Viewer
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Ad-hoc signature: without a paid Apple Developer ID the app is not
  # notarized, but an ad-hoc signed app gets the "Open Anyway" path in
  # System Settings instead of "damaged". Hardened runtime must be off for it.
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
dmg:
  title: Reader343
win:
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: zip
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
# Microsoft Store package (MSIX). Built on Windows only, by .github/workflows/store-windows.yml, which
# passes the three values the Store gives after the name is reserved (identityName, publisher,
# publisherDisplayName). The tiles are in build/appx/ (scripts/make-icons.mjs). The Store signs the package.
appx:
  displayName: Reader343
  backgroundColor: "#12131a"
  languages: [en-US, ar]
  showNameOnTiles: false
linux:
  target: [AppImage]
  category: Office
